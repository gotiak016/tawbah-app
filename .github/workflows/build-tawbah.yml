name: Build Tawbah Android APK & AAB

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 🏗️ Expo Prebuild Native Android
        run: npx expo prebuild --platform android --no-install

      - name: 🔧 Fix Kotlin version and Compose compatibility
        run: |
          # 1. Replace any 1.9.24 with 1.9.25 across all gradle and settings files
          find android/ -type f \( -name "*.gradle" -o -name "*.properties" \) -exec sed -i 's/1\.9\.24/1.9.25/g' {} +

          # 2. Add Compose compiler suppress flags to gradle.properties
          echo "" >> android/gradle.properties
          echo "kotlin.suppressKotlinVersionCompatibilityCheck=true" >> android/gradle.properties
          echo "androidx.compose.compiler.suppressKotlinVersionCompatibilityCheck=true" >> android/gradle.properties
          echo "suppressKotlinVersionCompatibilityCheck=true" >> android/gradle.properties

          echo "=== Verification ==="
          grep -rn "1.9.25" android/ || true
          tail -n 10 android/gradle.properties

      - name: 🔨 Build Release APK & AAB with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon -Pandroidx.compose.compiler.suppressKotlinVersionCompatibilityCheck=true -Pkotlin.suppressKotlinVersionCompatibilityCheck=true

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tawbah-Release-APK
          path: android/app/build/outputs/apk/release/*.apk

      - name: 📤 Upload Google Play AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tawbah-GooglePlay-AAB
          path: android/app/build/outputs/bundle/release/*.aab
