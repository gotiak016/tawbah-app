name: Build Tawbah Android APK & AAB

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 🎯 Patch React Native TOML Version Catalog to Kotlin 1.9.25
        run: |
          sed -i 's/kotlin = "1.9.24"/kotlin = "1.9.25"/g' node_modules/react-native/gradle/libs.versions.toml
          echo "Verified libs.versions.toml:"
          grep 'kotlin = ' node_modules/react-native/gradle/libs.versions.toml

      - name: 🏗️ Expo Prebuild Native Android
        run: npx expo prebuild --platform android --no-install

      - name: 🔧 Inject Compose Compiler Compatibility Override
        run: |
          # Patch all gradle files to 1.9.25 just in case
          find android/ -type f \( -name "*.gradle" -o -name "*.properties" -o -name "*.toml" \) -exec sed -i 's/1\.9\.24/1.9.25/g' {} +

          # Append suppress compiler args to root android/build.gradle
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                          kotlinOptions {
                              freeCompilerArgs += [
                                  "-P",
                                  "plugin:androidx.compose.compiler.plugins.kotlin:suppressKotlinVersionCompatibilityCheck=true"
                              ]
                          }
                      }
                  }
              }
          }
          EOF

      - name: 🔨 Build Release APK & AAB with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tawbah-Release-APK
          path: android/app/build/outputs/apk/release/*.apk

      - name: 📤 Upload Google Play AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tawbah-GooglePlay-AAB
          path: android/app/build/outputs/bundle/release/*.aab
